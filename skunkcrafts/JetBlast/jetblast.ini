# Jet Blast settings. Edit, then use Plugins > Jet Blast > Reload settings.

enabled = 1

# Strength of all forces on your aircraft (1.0 = modelled physics, 0.5 = half, 2.0 = double)
intensity = 1.0

# How far the blast reaches. 7 is the textbook free-jet value; raise to 8-9
# if you want takeoff-thrust blast to reach further (closer to manufacturer charts).
jet_constant = 7.0

# Random gusting of the blast, as a fraction of the mean speed (0 = steady)
gustiness = 0.30

# Ignore traffic farther away than this (metres)
max_range_m = 1500

# No blast effects when you are higher than this above ground (metres)
max_user_agl_m = 150

# Thrust model for traffic (networks do not send thrust, it is estimated from motion)
idle_thrust = 0.06
taxi_mass_factor = 0.80

# Ignore traffic below this thrust fraction (0 = none; Event mode uses 0.15 to skip idling aircraft)
min_thrust = 0.00

# Use X-Plane's own AI aircraft as blast sources when no traffic plugin owns TCAS
include_xplane_ai = 1

# Treat stationary traffic with the beacon off as engines off
use_beacon = 1

# Your aircraft size. 0 = automatic (from its ICAO type, else estimated from mass)
user_span_m = 0
user_length_m = 0

# Open the debug window when X-Plane starts
show_window = 0

# Check GitHub for a newer Jet Blast release when X-Plane starts
check_updates = 1

# Use LiveTraffic's flight phase (take-off roll, landing roll...) for its aircraft's thrust
use_livetraffic = 1

# Auto Event mode: switch to Event mode while at least this many aircraft are within 2 km
# (on after 10 s, off after 30 s below two thirds of the count). Never makes blast stronger.
auto_event = 1
auto_event_count = 15

# Jet blast warning when blast at your aircraft reaches warn_kt knots
warn_spoken = 1
warn_text = 1
warn_kt = 25
